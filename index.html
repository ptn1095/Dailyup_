<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DailyUp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: một "khu vườn" dạng app điện thoại — cột nội dung hẹp, thanh tab dưới đáy; màn rộng thì Hôm nay chia 2 cột (việc cần làm | cây & lời hay) */
:root{
  --bg:#EFF6EC; --surface:#FFFFFF; --surface-2:#E3EFDF; --line:#CFE0CA;
  --ink:#1D3A2A; --muted:#5B7264;
  --leaf:#2F9A45; --leaf-ink:#FFFFFF; --leaf-soft:#D6F0D6;
  --sun:#FFB21F; --sun-soft:#FFF0CC;
  --soil:#8A5A3B; --soil-soft:#E9D6C4;
  --sky:#3E9FD6; --sky-soft:#DCEFFA;
  --berry:#E0466C; --berry-soft:#FBDDE5;
  --shadow:0 2px 0 rgba(29,58,42,.08), 0 8px 24px -12px rgba(29,58,42,.25);
  --f-display:"Baloo 2","Nunito",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1E17; --surface:#172A21; --surface-2:#1F3529; --line:#2B4636;
  --ink:#E6F2E8; --muted:#9CB5A5;
  --leaf:#57C268; --leaf-ink:#0F1E17; --leaf-soft:#1F4029;
  --sun:#FFC24A; --sun-soft:#3A3116;
  --soil:#C08D67; --soil-soft:#3B2B20;
  --sky:#6CBCE8; --sky-soft:#173446;
  --berry:#F2708F; --berry-soft:#432030;
  --shadow:0 2px 0 rgba(0,0,0,.25), 0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1E17; --surface:#172A21; --surface-2:#1F3529; --line:#2B4636;
  --ink:#E6F2E8; --muted:#9CB5A5;
  --leaf:#57C268; --leaf-ink:#0F1E17; --leaf-soft:#1F4029;
  --sun:#FFC24A; --sun-soft:#3A3116;
  --soil:#C08D67; --soil-soft:#3B2B20;
  --sky:#6CBCE8; --sky-soft:#173446;
  --berry:#F2708F; --berry-soft:#432030;
  --shadow:0 2px 0 rgba(0,0,0,.25), 0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:1.45rem;font-weight:800}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{flex:none;display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:1.5rem;color:var(--leaf);letter-spacing:-.01em}
.brand svg{width:30px;height:30px}
.top .sp{flex:1}
.chip{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 6px;font-weight:800}
.chip .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--sun-soft);font-size:1.15rem}
.wallet{background:var(--sun-soft);border-color:transparent;color:var(--ink);padding:6px 12px;font-variant-numeric:tabular-nums}

/* Cards */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.grid-today{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.grid-today{grid-template-columns:minmax(0,1fr)}}
.sample{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--sky-soft);border-radius:var(--r-md);padding:10px 14px;font-size:.92rem}
.sample b{font-weight:800}

/* Hero */
.hero{display:flex;gap:16px;align-items:center;background:var(--leaf);color:var(--leaf-ink);border-radius:var(--r-lg);padding:20px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(1.5rem,4.5vw,2.1rem);font-weight:800}
.hero .date{opacity:.85;font-weight:700}
.hero .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;position:relative}
.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-weight:800;line-height:1}
.ring .lbl small{display:block;font-family:var(--f-body);font-size:.72rem;font-weight:700;opacity:.9}
.hero::after{content:"";position:absolute;right:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}

/* Mood */
.moods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:12px}
.mood{border:2px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:.82rem}
.mood span{font-size:1.7rem;line-height:1.1}
.mood[aria-pressed="true"]{border-color:var(--sun);background:var(--sun-soft)}
.tip{margin-top:10px;background:var(--berry-soft);border-radius:var(--r-sm);padding:10px 12px;font-size:.92rem}

/* Segmented */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:999px;padding:5px;gap:4px}
.seg button{border:0;background:transparent;border-radius:999px;padding:10px;font-weight:800;font-size:1rem;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg .n{font-size:.8rem;background:var(--leaf-soft);color:var(--ink);border-radius:999px;padding:0 8px}

/* Habits */
.slot{display:flex;flex-direction:column;gap:8px}
.slot-h{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:1.05rem;color:var(--muted);text-transform:none}
.slot-h::after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px}
.habit{display:flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-md);padding:6px;transition:background .2s,border-color .2s}
.habit.done{background:var(--leaf-soft);border-color:var(--leaf)}
.h-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:left;padding:6px;border-radius:12px}
.h-ic{width:46px;height:46px;flex:none;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;font-size:1.6rem}
.habit.done .h-ic{background:var(--surface)}
.h-tx{flex:1;min-width:0;display:flex;flex-direction:column}
.h-name{font-weight:800;font-size:1.02rem;line-height:1.25}
.h-meta{font-size:.82rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ver{color:var(--leaf);font-weight:800}
.check{width:34px;height:34px;flex:none;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;color:transparent;background:var(--surface)}
.habit.done .check{background:var(--leaf);border-color:var(--leaf);color:var(--leaf-ink)}
.habit.done .check{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.ibtn{width:40px;height:40px;flex:none;border:0;border-radius:12px;background:transparent;display:grid;place-items:center;color:var(--muted)}
.ibtn:hover{background:var(--surface-2);color:var(--ink)}
.ibtn svg{width:22px;height:22px}
.empty{text-align:center;padding:24px;color:var(--muted)}

/* Quote / praise */
.quote{background:var(--sun-soft);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:6px}
.quote .q{font-family:var(--f-display);font-weight:700;font-size:1.3rem;line-height:1.25}
.eyebrow{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.praise{display:flex;gap:12px;align-items:flex-start;background:var(--berry-soft);border-radius:var(--r-md);padding:12px 14px}
.praise .who{font-weight:800}
.praise .ic{font-size:1.6rem;line-height:1}

/* Garden */
.garden{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.garden{grid-template-columns:minmax(0,1fr)}}
.tree-box{background:linear-gradient(var(--sky-soft),var(--surface) 70%);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px}
.tree-box svg.tree{width:100%;max-width:100%;height:auto;display:block}
.stage{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.stage h2{color:var(--leaf)}
.bar{height:14px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:999px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);padding:12px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:1.8rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted);font-weight:700}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.badge{border-radius:var(--r-md);border:2px dashed var(--line);padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.badge .e{font-size:2rem;line-height:1;filter:grayscale(1);opacity:.45}
.badge b{font-size:.88rem;line-height:1.2}
.badge small{font-size:.74rem;color:var(--muted);line-height:1.25}
.badge.got{border-style:solid;border-color:var(--sun);background:var(--sun-soft)}
.badge.got .e{filter:none;opacity:1}
.stages{display:flex;gap:4px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
.stages span{padding:2px 8px;border-radius:999px;background:var(--surface-2)}
.stages span.on{background:var(--leaf);color:var(--leaf-ink);font-weight:800}

/* Week */
.chart svg{width:100%;height:auto;display:block}
.tbl-wrap{overflow-x:auto}
table.dots{border-collapse:collapse;width:100%;min-width:460px;font-size:.88rem}
table.dots th,table.dots td{padding:6px 4px;text-align:center}
table.dots th:first-child,table.dots td:first-child{text-align:left;font-weight:700}
table.dots thead th{color:var(--muted);font-weight:800;font-size:.78rem}
.dot{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--surface-2)}
.dot.y{background:var(--leaf)}
.dot.v{background:var(--leaf);box-shadow:0 0 0 3px var(--sun)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);align-items:center}
.legend .dot{width:12px;height:12px;vertical-align:-1px;margin-right:4px}

/* Rewards */
.rewards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.reward{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px}
.reward .e{font-size:2.2rem;line-height:1}
.reward .cost{font-weight:800;color:var(--soil)}
.req{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);background:var(--surface-2);flex-wrap:wrap}
.pill{font-size:.75rem;font-weight:800;border-radius:999px;padding:2px 10px}
.pill.cho{background:var(--sun-soft);color:var(--ink)}
.pill.ok{background:var(--leaf-soft);color:var(--ink)}
.pill.no{background:var(--berry-soft);color:var(--ink)}

/* Buttons & forms */
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:800;background:var(--leaf);color:var(--leaf-ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.sun{background:var(--sun);color:#3A2600}
.btn.danger{background:var(--berry);color:#fff}
.btn.sm{padding:6px 12px;font-size:.88rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > .grow{flex:1;min-width:160px}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.88rem}
input.in,select.in,textarea.in{border:2px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px 12px;font-size:1rem;width:100%}
textarea.in{min-height:80px;resize:vertical}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);background:var(--surface-2)}
.li .t{flex:1;min-width:0}
.li .e{font-size:1.4rem}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.lib button{display:flex;align-items:center;gap:8px;text-align:left;border:2px dashed var(--line);background:transparent;border-radius:var(--r-sm);padding:8px 10px;font-weight:700;font-size:.9rem}
.lib button:hover{border-color:var(--leaf)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.88rem;font-weight:700}
.avs{display:flex;gap:6px;flex-wrap:wrap}
.avs button{width:52px;height:52px;border-radius:50%;border:3px solid transparent;background:var(--surface-2);font-size:1.7rem}
.avs button[aria-pressed="true"]{border-color:var(--sun);background:var(--sun-soft)}
.pin{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:360px;margin:24px auto}
.pin input{text-align:center;font-size:2rem;letter-spacing:.5em;font-family:var(--f-display);max-width:220px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tabs2{display:flex;gap:6px;flex-wrap:wrap}
.tabs2 button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:800;font-size:.9rem}
.tabs2 button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 10px;text-decoration:none;color:var(--muted);font-weight:800;font-size:.74rem}
.nav a svg{width:26px;height:26px}
.nav a[aria-current="page"]{color:var(--leaf)}
.nav a[aria-current="page"] svg{transform:translateY(-1px)}

/* Toast, modal, confetti */
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:800;padding:10px 18px;border-radius:999px;z-index:20;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
.modal{position:fixed;inset:0;z-index:30;background:rgba(10,25,18,.55);display:grid;place-items:center;padding:16px}
.modal .card{max-width:380px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.clock{font-family:var(--f-display);font-weight:800;font-size:4rem;line-height:1;font-variant-numeric:tabular-nums;color:var(--leaf)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:25}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head><body>
<div id="app" class="wrap"></div>
<nav class="nav" id="nav" aria-label="Chuyển mục"></nav>
<canvas id="fx"></canvas>
<div id="toast" class="toast" hidden></div>
<div id="modal" class="modal" hidden></div>

<script>

const pad=n=>String(n).padStart(2,"0");

const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const todayKey=()=>keyOf(new Date());
const fromKey=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};

const STORE="dailyup.v1";
let S;
function save(){try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem(STORE);if(r)return JSON.parse(r)}catch(e){}return null}

function makeKid(name,cls,av){
  return {id:uid(),name,cls,av,habits:DEFAULT_KEYS.map(k=>habitFrom(LIB.find(l=>l.k===k))),log:{},praise:[],req:[]};
}
function seed(){
  const kid=makeKid("Minh Anh","3A2","🐰");
  const now=new Date();
  let h=7;const rnd=()=>{h=(h*9301+49297)%233280;return h/233280};
  for(let d=9;d>=1;d--){
    const k=keyOf(addDays(now,-d));const done={},ver={};
    kid.habits.forEach(x=>{if(rnd()<0.74){done[x.id]=1;if(rnd()<0.5)ver[x.id]=1}});
    kid.log[k]={done,ver,mood:MOODS[Math.floor(rnd()*3)][0]};
  }
  const t={done:{},ver:{},mood:""};
  kid.habits.filter(x=>x.p==="nha"&&x.s==="sang").forEach(x=>t.done[x.id]=1);
  kid.log[keyOf(now)]=t;
  kid.praise.push({id:uid(),d:keyOf(addDays(now,-1)),from:"Cô giáo chủ nhiệm",text:"Hôm qua Minh Anh xếp ghế và nhặt rác rất chăm chỉ. Cô khen em!"});
  kid.praise.push({id:uid(),d:keyOf(addDays(now,-3)),from:"Mẹ",text:"Con tự soạn cặp sách gọn gàng, mẹ rất vui."});
  const rw=REWARDS.map(r=>({id:uid(),...r}));
  kid.req.push({id:uid(),rid:rw[0].id,n:rw[0].n,i:rw[0].i,c:rw[0].c,d:keyOf(addDays(now,-2)),st:"ok"});
  return {v:1,sample:true,pin:"1234",kids:[kid],active:kid.id,rewards:rw};
}
S=load()||seed();

/* ---------- Tính toán ---------- */
const kid=()=>S.kids.find(k=>k.id===S.active)||S.kids[0];
const dayLog=(k,key)=>k.log[key]||(k.log[key]={done:{},ver:{},mood:""});
const peekLog=(k,key)=>k.log[key]||{done:{},ver:{},mood:""};
function dayStars(k,key){const l=peekLog(k,key);let s=0;for(const id in l.done){const h=k.habits.find(x=>x.id===id);s+=(h?h.st:1)+(l.ver[id]?1:0)}return s}
function lifetime(k){let s=0;for(const key in k.log)s+=dayStars(k,key);return s}
function spent(k){return k.req.filter(r=>r.st==="ok"||r.st==="cho").reduce((a,r)=>a+r.c,0)}
function wallet(k){return Math.max(0,lifetime(k)-spent(k))}
function dayPct(k,key){const n=k.habits.length;if(!n)return 0;const l=peekLog(k,key);const c=k.habits.filter(h=>l.done[h.id]).length;return c/n}
function streak(k){let d=new Date();if(dayPct(k,keyOf(d))<0.5)d=addDays(d,-1);let n=0;while(dayPct(k,keyOf(d))>=0.5&&n<999){n++;d=addDays(d,-1)}return n}
function bestStreak(k){const keys=Object.keys(k.log).sort();if(!keys.length)return 0;let best=0,cur=0,prev=null;keys.forEach(key=>{const ok=dayPct(k,key)>=0.5;const d=fromKey(key);if(ok){cur=(prev&&keyOf(addDays(prev,1))===key)?cur+1:1;best=Math.max(best,cur);prev=d}else{cur=0;prev=null}});return best}
function perfectDays(k){return Object.keys(k.log).filter(key=>dayPct(k,key)===1).length}
function countTag(k,tag){let n=0;for(const key in k.log){for(const id in k.log[key].done){const h=k.habits.find(x=>x.id===id);if(h&&h.k===tag)n++}}return n}
function countPlace(k,p){let n=0;for(const key in k.log){for(const id in k.log[key].done){const h=k.habits.find(x=>x.id===id);if(h&&h.p===p)n++}}return n}
function stageOf(stars){let i=0;STAGES.forEach((s,j)=>{if(stars>=s[0])i=j});return i}
function badges(k){
  const L=lifetime(k),bs=bestStreak(k),total=Object.values(k.log).reduce((a,l)=>a+Object.keys(l.done).length,0);
  return [
    ["🌱","Hạt giống đầu tiên","Hoàn thành việc tốt đầu tiên",total>=1],
    ["🔥","Chuỗi 3 ngày","3 ngày liền làm được ít nhất một nửa",bs>=3],
    ["🌈","Chuỗi 7 ngày","Một tuần chăm chỉ không nghỉ",bs>=7],
    ["🌳","21 ngày thành nếp","Đủ 21 ngày, thói quen đã bén rễ",bs>=21],
    ["💯","Ngày hoàn hảo","Làm hết tất cả việc trong một ngày",perfectDays(k)>=1],
    ["📚","Mọt sách nhí","Đọc sách 5 lần",countTag(k,"doc-sach")>=5],
    ["🧹","Trợ thủ của mẹ","Giúp việc nhà 5 lần",countTag(k,"viec-nha")>=5],
    ["🏫","Học trò ngoan","Làm 20 việc tốt ở trường",countPlace(k,"truong")>=20],
    ["🤝","Bạn tốt","Giúp đỡ bạn 3 lần",countTag(k,"giup-ban")>=3],
    ["⭐","100 ngôi sao","Gom được 100 ngôi sao",L>=100]
  ];
}

/* ---------- Hôm nay ---------- */
function greet(){const h=new Date().getHours();return h<11?"Chào buổi sáng":h<13?"Chào buổi trưa":h<18?"Chào buổi chiều":"Chào buổi tối"}
function ring(p){const r=40,c=2*Math.PI*r;return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${r}" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="11"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--sun)" stroke-width="11" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}"/></svg>`}
function vToday(k){
  const key=todayKey(),l=peekLog(k,key);
  if(!UI.place)UI.place=defaultPlace();
  const doneN=k.habits.filter(h=>l.done[h.id]).length,tot=k.habits.length,p=tot?doneN/tot:0;
  const msg=p===1?"Tuyệt vời! Con đã làm hết việc tốt hôm nay.":p>=.5?"Con đã đi được hơn nửa chặng rồi, cố lên!":doneN?"Khởi đầu thật tốt, làm tiếp nhé!":"Cùng gieo hạt giống đầu tiên của ngày nào!";
  const mood=l.mood;
  const tip=(mood==="buon"||mood==="buc")?`<div class="tip">Không sao đâu con. Hãy hít thật sâu 3 lần, rồi kể cho bố mẹ hoặc thầy cô nghe chuyện làm con ${mood==="buon"?"buồn":"bực"} nhé.</div>`:mood==="met"?`<div class="tip">Con nhớ uống nước và nghỉ ngơi một chút nhé.</div>`:"";
  const inPlace=p2=>k.habits.filter(h=>h.p===p2);
  const cnt=p2=>{const a=inPlace(p2);return a.filter(h=>l.done[h.id]).length+"/"+a.length};
  const list=inPlace(UI.place);
  const slots=Object.keys(SLOTS).map(s=>{
    const hs=list.filter(h=>h.s===s);if(!hs.length)return "";
    return `<section class="slot"><div class="slot-h">${SLOTS[s]}</div>${hs.map(h=>habitRow(h,l)).join("")}</section>`;
  }).join("")||`<div class="empty">Chưa có việc nào ${PLACES[UI.place].toLowerCase()}. Nhờ bố mẹ hoặc thầy cô thêm trong Góc cài đặt nhé.</div>`;
  const qi=Math.floor(fromKey(key).getTime()/864e5)%QUOTES.length,q=QUOTES[qi];
  const lastP=k.praise.slice().sort((a,b)=>a.d<b.d?1:-1)[0];
  return `<div class="grid-today">
   <div class="stack">
    <section class="hero">
      <div class="txt"><span class="date">${fmtDate(new Date())}</span><h1>${greet()}, ${esc(k.name)}!</h1><p>${msg}</p></div>
      <div class="ring">${ring(p)}<div class="lbl"><div>${doneN}/${tot}<small>việc tốt</small></div></div></div>
    </section>
    <section class="card"><h3>Hôm nay con thấy thế nào?</h3>
      <div class="moods">${MOODS.map(m=>`<button class="mood" data-act="mood" data-v="${m[0]}" aria-pressed="${mood===m[0]}"><span>${m[1]}</span>${m[2]}</button>`).join("")}</div>${tip}
    </section>
    <div class="seg" role="group" aria-label="Chọn nơi">
      <button data-act="place" data-v="nha" aria-pressed="${UI.place==="nha"}">🏠 Ở nhà <span class="n">${cnt("nha")}</span></button>
      <button data-act="place" data-v="truong" aria-pressed="${UI.place==="truong"}">🏫 Ở trường <span class="n">${cnt("truong")}</span></button>
    </div>
    <div class="stack">${slots}</div>
   </div>
   <aside class="stack">
    <section class="tree-box" style="cursor:pointer" data-act="go" data-v="khu-vuon">${treeBlock(k,true)}</section>
    <section class="quote"><span class="eyebrow">Lời hay hôm nay</span><p class="q">“${q[0]}”</p><p class="muted">${q[1]}</p>
      <div><button class="btn ghost sm" data-act="say" data-t="${esc(q[0]+" "+q[1])}">${ICON.speak.replace("<svg",'<svg width="18" height="18"')} Nghe đọc</button></div></section>
    ${lastP?`<section class="praise"><span class="ic">💌</span><div><div class="who">${esc(lastP.from)} gửi lời khen</div><p>${esc(lastP.text)}</p><small class="muted">${fmtDate(fromKey(lastP.d))}</small></div></section>`:""}
   </aside>
  </div>`;
}
function habitRow(h,l){
  const d=!!l.done[h.id],v=!!l.ver[h.id];
  return `<div class="habit ${d?"done":""}">
    <button class="h-main" data-act="toggle" data-id="${h.id}" aria-pressed="${d}">
      <span class="h-ic" aria-hidden="true">${h.i}</span>
      <span class="h-tx"><span class="h-name">${esc(h.n)}</span>
      <span class="h-meta"><span>+${h.st} ⭐</span>${h.min?`<span>${h.min} phút</span>`:""}${v?`<span class="ver">✓ Người lớn đã xác nhận +1</span>`:""}</span></span>
      <span class="check">${ICON.check}</span>
    </button>
    ${h.min&&!d?`<button class="ibtn" data-act="timer" data-id="${h.id}" aria-label="Bấm giờ ${h.min} phút">${ICON.timer}</button>`:""}
    <button class="ibtn" data-act="say" data-t="${esc(h.n)}" aria-label="Đọc to">${ICON.speak}</button>
  </div>`;
}

/* ---------- Cây ---------- */
function treeSVG(st){
  const s=stageOf(st);
  let g=`<svg class="tree" viewBox="0 0 320 240" role="img" aria-label="Cây của bé: ${STAGES[s][1]}">
   <circle cx="275" cy="42" r="22" fill="var(--sun)"/>
   <ellipse cx="160" cy="218" rx="130" ry="20" fill="var(--soil)"/>
   <ellipse cx="160" cy="212" rx="96" ry="12" fill="var(--soil)" opacity=".7"/>`;
  if(s===0){
    g+=`<ellipse cx="160" cy="203" rx="12" ry="8" fill="var(--soil-soft)" stroke="var(--soil)" stroke-width="3"/>`;
  }else if(s===1){
    g+=`<path d="M160 210 V178" stroke="var(--leaf)" stroke-width="6" stroke-linecap="round"/>
        <ellipse cx="146" cy="176" rx="15" ry="8" transform="rotate(-25 146 176)" fill="var(--leaf)"/>
        <ellipse cx="174" cy="172" rx="15" ry="8" transform="rotate(25 174 172)" fill="var(--leaf)"/>`;
  }else{
    const H=[0,0,60,85,110,125,135][s],W=[0,0,8,12,16,20,22][s],top=210-H;
    const R=[0,0,30,42,54,62,68][s];
    g+=`<rect x="${160-W/2}" y="${top}" width="${W}" height="${H}" rx="${W/2}" fill="var(--soil)"/>`;
    if(s>=4)g+=`<path d="M160 ${top+H*.45} l${R*.5} -${R*.35}" stroke="var(--soil)" stroke-width="${W*.45}" stroke-linecap="round"/><path d="M160 ${top+H*.55} l-${R*.5} -${R*.3}" stroke="var(--soil)" stroke-width="${W*.45}" stroke-linecap="round"/>`;
    const blobs=[[0,0,1],[-.8,.35,.7],[.8,.35,.7],[-.5,-.55,.65],[.5,-.55,.65],[0,-.9,.55]].slice(0,s>=4?6:s>=3?5:3);
    blobs.forEach((b,i)=>g+=`<circle cx="${160+b[0]*R}" cy="${top+b[1]*R}" r="${R*b[2]}" fill="var(--leaf)" opacity="${i%2?.85:1}"/>`);
    if(s>=5){[[-.6,-.1],[.5,.2],[-.1,-.7],[.75,-.4],[-.85,.45],[.15,.4]].forEach(f=>{const x=160+f[0]*R,y=top+f[1]*R;g+=`<circle cx="${x}" cy="${y}" r="6" fill="var(--berry-soft)"/><circle cx="${x}" cy="${y}" r="2.6" fill="var(--sun)"/>`})}
    if(s>=6){[[-.3,.3],[.35,-.15],[-.7,-.45],[.7,.55],[.05,-.35]].forEach(f=>g+=`<circle cx="${160+f[0]*R}" cy="${top+f[1]*R}" r="8" fill="var(--berry)"/>`)}
  }
  return g+`</svg>`;
}
function treeBlock(k,compact){
  const L=lifetime(k),s=stageOf(L),nx=STAGES[s+1];
  const pr=nx?(L-STAGES[s][0])/(nx[0]-STAGES[s][0]):1;
  return `<div class="stage"><h2>${STAGES[s][1]}</h2><span class="muted"><b>${L}</b> ⭐ đã tưới</span></div>
    ${treeSVG(L)}
    <div class="bar" role="progressbar" aria-valuenow="${Math.round(pr*100)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${Math.round(pr*100)}%"></i></div>
    <p class="muted" style="font-size:.9rem">${nx?`Thêm <b>${nx[0]-L} ⭐</b> nữa cây sẽ <b>${nx[1].toLowerCase()}</b>.`:"Cây đã kết trái! Con thật kiên trì."}${compact?" Chạm để vào khu vườn.":""}</p>`;
}

/* ---------- Khu vườn ---------- */
function vGarden(k){

  return `<h2>Khu vườn của ${esc(k.name)}</h2>

    <section class="tree-box">${treeBlock(k,false)}

    </section>

      <div class="stats">
        <div class="stat"><b>${streak(k)}</b><span>ngày liên tiếp</span></div>
        <div class="stat"><b>${bestStreak(k)}</b><span>chuỗi dài nhất</span></div>
        <div class="stat"><b>${perfectDays(k)}</b><span>ngày hoàn hảo</span></div>
      </div>
      <section class="card stack"><div class="sec-h"><h3>Huy hiệu</h3><span class="muted">${got}/${b.length}</span></div>

/* ---------- Tuần này ---------- */
function vWeek(k){
  const days=[];for(let i=6;i>=0;i--)days.push(addDays(new Date(),-i));
  const W=340,H=190,pl=34,pb=34,pt=14,cw=(W-pl-8)/7,bw=cw*.56,ch=H-pb-pt;
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Phần trăm việc tốt hoàn thành 7 ngày qua">`;
  [0,50,100].forEach(v=>{const y=pt+ch*(1-v/100);svg+=`<line x1="${pl}" x2="${W-6}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1" ${v?'stroke-dasharray="3 4"':""}/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}%</text>`});
  let sum=0;
  days.forEach((d,i)=>{const p=dayPct(k,keyOf(d));sum+=p;const x=pl+i*cw+(cw-bw)/2,h=Math.max(2,ch*p),y=pt+ch-h,isT=i===6;
    svg+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="6" fill="${p===1?"var(--sun)":"var(--leaf)"}" opacity="${isT?1:.85}"/>`;
    if(p>0)svg+=`<text x="${x+bw/2}" y="${y-5}" text-anchor="middle" font-size="11" font-weight="800" fill="var(--ink)">${Math.round(p*100)}</text>`;
    svg+=`<text x="${x+bw/2}" y="${H-14}" text-anchor="middle" font-size="12" font-weight="${isT?800:600}" fill="${isT?"var(--ink)":"var(--muted)"}">${isT?"Nay":DOWS[d.getDay()]}</text><text x="${x+bw/2}" y="${H-2}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${pad(d.getDate())}/${pad(d.getMonth()+1)}</text>`});
  svg+=`</svg>`;
  const avg=Math.round(sum/7*100);
  const starsW=days.reduce((a,d)=>a+dayStars(k,keyOf(d)),0);
  const moodRow=days.map(d=>{const m=MOODS.find(x=>x[0]===peekLog(k,keyOf(d)).mood);return `<td title="${m?m[2]:"Chưa chọn"}">${m?m[1]:"·"}</td>`}).join("");
  const rows=Object.keys(PLACES).map(p=>{const hs=k.habits.filter(h=>h.p===p);if(!hs.length)return "";return `<tr><td colspan="8" style="padding-top:12px;color:var(--muted);font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase">${PLACES[p]}</td></tr>`+hs.map(h=>`<tr><td>${h.i} ${esc(h.n)}</td>${days.map(d=>{const l=peekLog(k,keyOf(d));return `<td><span class="dot ${l.done[h.id]?(l.ver[h.id]?"v":"y"):""}"></span></td>`}).join("")}</tr>`).join("")}).join("");
  // Gợi ý: thói quen yếu nhất
  let weak=null;k.habits.forEach(h=>{const c=days.filter(d=>peekLog(k,keyOf(d)).done[h.id]).length;if(!weak||c<weak.c)weak={h,c}});
  return `<h2>Tuần này của ${esc(k.name)}</h2>
  <div class="stats">
    <div class="stat"><b>${avg}%</b><span>trung bình mỗi ngày</span></div>
    <div class="stat"><b>${starsW}</b><span>sao trong 7 ngày</span></div>
    <div class="stat"><b>${streak(k)}</b><span>ngày liên tiếp</span></div>
  </div>
  <section class="card chart stack"><h3>Mỗi ngày con làm được bao nhiêu phần trăm?</h3>${svg}
    <div class="legend"><span><span class="dot y"></span>Ngày thường</span><span><span class="dot" style="background:var(--sun)"></span>Ngày hoàn hảo 100%</span></div></section>
  ${weak&&weak.c<4?`<section class="quote"><span class="eyebrow">Gợi ý cho tuần sau</span><p class="q">${weak.h.i} ${esc(weak.h.n)}</p><p class="muted">Tuần này con mới làm ${weak.c}/7 ngày. Bố mẹ và con hãy chọn một giờ cố định để làm việc này nhé.</p></section>`:""}
  <section class="card stack"><h3>Từng thói quen trong tuần</h3>
    <div class="tbl-wrap"><table class="dots"><thead><tr><th></th>${days.map((d,i)=>`<th>${i===6?"Nay":DOWS[d.getDay()]}</th>`).join("")}</tr></thead>
    <tbody><tr><td>Cảm xúc</td>${moodRow}</tr>${rows}</tbody></table></div>
    <div class="legend"><span><span class="dot y"></span>Đã làm</span><span><span class="dot v"></span>Người lớn đã xác nhận</span><span><span class="dot"></span>Chưa làm</span></div>
  </section>`;
}

/* ---------- Đổi quà ---------- */

}

function kidForm(id,label){
  return `<form id="${id}" class="stack">
    <div class="row"><label class="f grow">Tên của bé<input class="in" id="${id}-name" placeholder="Ví dụ: Bảo Ngọc" required></label><label class="f" style="width:120px">Lớp<input class="in" id="${id}-cls" placeholder="3A2"></label></div>
    <div class="f">Chọn bạn đồng hành<div class="avs">${AVATARS.map(a=>`<button type="button" data-act="av" data-v="${a}" aria-pressed="${UI.av===a}">${a}</button>`).join("")}</div></div>
    <div><button class="btn" type="submit">${label}</button></div></form>`;
}
function onboarding(){
  return `<header class="top"><div class="brand">DailyUp</div></header>
  <main class="stack" style="max-width:560px;margin:0 auto">
    <section class="hero"><div class="txt"><h1>Gieo thói quen tốt, lớn khôn mỗi ngày</h1><p>Mỗi việc tốt con làm là một giọt nước tưới cho cây của con lớn lên.</p></div></section>
    <section class="card stack"><h3>Bé tên là gì nhỉ?</h3>${kidForm("firstKid","Bắt đầu gieo hạt")}
    <p class="muted" style="font-size:.88rem">Mã PIN Góc cài đặt mặc định là 1234, hãy đổi sau khi bắt đầu.</p></section>
  </main>`;
}

/* ---------- Hiệu ứng ---------- */
let toastT;
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}
let ac;
function ding(up){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type="sine";const t=ac.currentTime;o.frequency.setValueAtTime(up?660:440,t);o.frequency.exponentialRampToValueAtTime(up?1320:330,t+.15);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.32)}catch(e){}}
function say(text){
  try{
    if(!("speechSynthesis" in window)){toast("Máy này chưa hỗ trợ đọc to");return}
    const u=new SpeechSynthesisUtterance(text);u.lang="vi-VN";u.rate=.9;
    const v=speechSynthesis.getVoices().find(v=>(v.lang||"").toLowerCase().startsWith("vi"));
    if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){toast("Máy này chưa hỗ trợ đọc to")}
}
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(x,y,big){
  if(reduce)return;const c=$("#fx"),g=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cs=getComputedStyle(document.documentElement);const cols=["--leaf","--sun","--berry","--sky"].map(v=>cs.getPropertyValue(v).trim());
  const P=[];const n=big?120:26;
  for(let i=0;i<n;i++)P.push({x,y,vx:(Math.random()-.5)*(big?14:8),vy:-Math.random()*(big?14:8)-2,r:3+Math.random()*4,c:cols[i%4],a:1,rot:Math.random()*6});
  let f=0;(function tick(){g.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.a-=.012;p.rot+=.2;g.globalAlpha=Math.max(0,p.a);g.fillStyle=p.c;g.save();g.translate(p.x,p.y);g.rotate(p.rot);g.fillRect(-p.r,-p.r/2,p.r*2,p.r);g.restore()});f++;if(f<90)requestAnimationFrame(tick);else g.clearRect(0,0,c.width,c.height)})();
}

/* ---------- Bấm giờ ---------- */
let TM=null;
function openTimer(h){
  TM={h,left:h.min*60,run:false,iv:null};
  const m=$("#modal");m.hidden=false;
  m.innerHTML=`<div class="card" role="dialog" aria-modal="true" aria-label="Bấm giờ"><span style="font-size:3rem">${h.i}</span><h2>${esc(h.n)}</h2><div class="clock" id="clk"></div>
    <div class="row" style="justify-content:center"><button class="btn sun" data-act="tm-go" id="tmGo">Bắt đầu</button><button class="btn ghost" data-act="tm-close">Đóng</button></div>
    <p class="muted" style="font-size:.88rem">Hết giờ, việc này sẽ tự được đánh dấu hoàn thành.</p></div>`;
  drawClock();
}
function drawClock(){const c=$("#clk");if(c&&TM)c.textContent=pad(Math.floor(TM.left/60))+":"+pad(TM.left%60)}
function closeTimer(){if(TM)clearInterval(TM.iv);TM=null;$("#modal").hidden=true;$("#modal").innerHTML=""}

/* ---------- Hành động ---------- */
function setHabit(id,on,ev){
  const k=kid(),l=dayLog(k,todayKey()),h=k.habits.find(x=>x.id===id);
  if(on){l.done[id]=1;S.sample&&0;ding(true);
    const all=k.habits.every(x=>l.done[x.id]);
    const r=ev&&ev.getBoundingClientRect?ev.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0};
    confetti(r.left+r.width-30,r.top+r.height/2,all);
    toast(all?"Hoàn thành tất cả! Cây của con lớn thêm rồi 🌳":"Giỏi lắm! +"+h.st+" ⭐");
  }else{delete l.done[id];delete l.ver[id];ding(false)}
  save();render();
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  const a=t.dataset.act,k=S.kids.length?kid():null;
  switch(a){
    case "toggle":{const l=dayLog(k,todayKey());setHabit(t.dataset.id,!l.done[t.dataset.id],t);break}
    case "mood":{const l=dayLog(k,todayKey());l.mood=l.mood===t.dataset.v?"":t.dataset.v;save();render();break}
    case "place":UI.place=t.dataset.v;render();break;
    case "say":say(t.dataset.t);break;
    case "go":location.hash=t.dataset.v;break;
    case "timer":openTimer(k.habits.find(x=>x.id===t.dataset.id));break;
    case "tm-go":{if(!TM)break;if(TM.run){clearInterval(TM.iv);TM.run=false;t.textContent="Tiếp tục"}else{TM.run=true;t.textContent="Tạm dừng";TM.iv=setInterval(()=>{TM.left--;drawClock();if(TM.left<=0){const id=TM.h.id;closeTimer();setHabit(id,true,null)}},1000)}break}
    case "tm-close":closeTimer();break;
    case "switch-kid":{if(S.kids.length<2){location.hash="cai-dat";UI.adminTab="ho-so";render();break}const i=S.kids.findIndex(x=>x.id===S.active);S.active=S.kids[(i+1)%S.kids.length].id;save();render();toast("Đang xem: "+kid().name);break}
    case "redeem":{const r=S.rewards.find(x=>x.id===t.dataset.id);if(!r||wallet(k)<r.c)break;k.req.push({id:uid(),rid:r.id,n:r.n,i:r.i,c:r.c,d:todayKey(),st:"cho"});save();render();toast("Đã gửi! Chờ người lớn duyệt nhé");break}
    case "atab":UI.adminTab=t.dataset.v;UI.confirmReset=false;render();break;
    case "lock":UI.unlocked=false;render();break;
    case "ver":{const l=dayLog(k,todayKey());l.ver[t.dataset.id]=1;save();render();toast("Đã xác nhận, bé được thêm 1 ⭐");break}
    case "ver-all":{const l=dayLog(k,todayKey());Object.keys(l.done).forEach(id=>l.ver[id]=1);save();render();toast("Đã xác nhận tất cả");break}
    case "req-ok":case "req-no":{const r=k.req.find(x=>x.id===t.dataset.id);if(r){r.st=a==="req-ok"?"ok":"no";save();render();toast(a==="req-ok"?"Đã duyệt phần thưởng":"Đã để lại sau")}break}
    case "pfrom":UI.praiseFrom=t.dataset.v;document.querySelectorAll('[data-act="pfrom"]').forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===UI.praiseFrom));break;
    case "pchip":{const ta=$("#praiseText");ta.value=(ta.value?ta.value.trim()+" ":"")+t.dataset.t;ta.focus();break}
    case "libp":UI.libPlace=t.dataset.v;render();break;
    case "add-lib":{const l=LIB.find(x=>x.k===t.dataset.k);k.habits.push(habitFrom(l));save();render();toast("Đã thêm: "+l.n);break}
    case "del-habit":{k.habits=k.habits.filter(h=>h.id!==t.dataset.id);save();render();break}
    case "del-reward":S.rewards=S.rewards.filter(r=>r.id!==t.dataset.id);save();render();break;
    case "pick-kid":S.active=t.dataset.id;save();render();break;
    case "av":UI.av=t.dataset.v;t.closest(".avs").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===UI.av));break;
    case "reset-ask":UI.confirmReset=true;render();break;
    case "reset-cancel":UI.confirmReset=false;render();break;
    case "reset-do":S={v:1,sample:false,pin:S.pin,kids:[],active:null,rewards:REWARDS.map(r=>({id:uid(),...r}))};UI.confirmReset=false;UI.unlocked=false;save();location.hash="hom-nay";render();break;
  }
});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target,k=S.kids.length?kid():null;
  if(f.id==="pinForm"){const v=$("#pinIn").value.trim();if(v===S.pin){UI.unlocked=true;render()}else{toast("Mã PIN chưa đúng, thử lại nhé");$("#pinIn").value=""}}
  else if(f.id==="praiseForm"){const v=$("#praiseText").value.trim();if(!v){toast("Hãy viết vài lời khen cho bé");return}k.praise.push({id:uid(),d:todayKey(),from:UI.praiseFrom,text:v});save();render();toast("Đã gửi lời khen 💌")}
  else if(f.id==="habitForm"){const n=$("#hName").value.trim();if(!n)return;k.habits.push({id:uid(),k:"tu-tao",i:$("#hIcon").value.trim()||"🌟",n,p:$("#hPlace").value,s:$("#hSlot").value,st:+$("#hStars").value,min:Math.max(0,Math.min(60,+$("#hMin").value||0))});save();render();toast("Đã thêm: "+n)}
  else if(f.id==="rewardForm"){const n=$("#rName").value.trim();if(!n)return;S.rewards.push({id:uid(),i:$("#rIcon").value.trim()||"🎁",n,c:Math.max(1,+$("#rCost").value||10)});save();render();toast("Đã thêm phần thưởng")}
  else if(f.id==="pinChange"){const v=$("#newPin").value.trim();if(!/^\d{4}$/.test(v)){toast("Mã PIN cần đúng 4 chữ số");return}S.pin=v;save();toast("Đã đổi mã PIN");$("#newPin").value=""}
  else if(f.id==="firstKid"||f.id==="addKidForm"){const n=$("#"+f.id+"-name").value.trim();if(!n)return;const nk=makeKid(n,$("#"+f.id+"-cls").value.trim(),UI.av);S.kids.push(nk);S.active=nk.id;save();if(f.id==="firstKid"){location.hash="hom-nay"}render();toast("Chào mừng "+n+" đến với DailyUp!")}
});
/* ---------- Điều hướng ---------- */
function route(){const h=location.hash.slice(1);UI.view=VIEWS.some(v=>v[0]===h)?h:"hom-nay";render();window.scrollTo(0,0)}
addEventListener("hashchange",route);
try{speechSynthesis.getVoices()}catch(e){}
route();
})();
</script>
</body></html>
